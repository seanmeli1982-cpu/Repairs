<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Local Trade & Repair Dispatch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px 12px; }
    .card { background: #1e293b; width: 100%; max-width: 440px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .badge { display: inline-block; background: #ef4444; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
    p.sub { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    button { width: 100%; background: #22c55e; color: #052e16; font-size: 16px; font-weight: 700; padding: 14px; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background: #16a34a; }
    .footer-note { font-size: 12px; color: #64748b; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Live 24/7 Dispatch</div>
    <h1>Fast Local Trade Callout</h1>
    <p class="sub">Get an immediate response from a verified local specialist in your area.</p>

    <form id="leadForm">
      <div class="form-group">
        <label>SERVICE REQUIRED</label>
        <select id="trade" required>
          <option value="Emergency Plumbing / Leak">Emergency Plumbing / Leak</option>
          <option value="Boiler Repair / Heating">Boiler Repair / Heating</option>
          <option value="Locksmith / Lock Out">Locksmith / Lock Out</option>
          <option value="Rubbish / Waste Clearance">Rubbish / Waste Clearance</option>
          <option value="Handyman / General Repair">Handyman / General Repair</option>
        </select>
      </div>

      <div class="form-group">
        <label>YOUR POSTCODE / AREA</label>
        <input type="text" id="postcode" placeholder="e.g. NE12 or local area" required>
      </div>

      <div class="form-group">
        <label>YOUR NAME</label>
        <input type="text" id="name" placeholder="First Name" required>
      </div>

      <div class="form-group">
        <label>BRIEF DETAILS OF JOB</label>
        <textarea id="details" rows="3" placeholder="What needs fixing?" required></textarea>
      </div>

      <button type="button" onclick="sendToWhatsApp()">Request Fast Callout on WhatsApp</button>
    </form>

    <p class="footer-note">🔒 No upfront fee • Average response under 10 mins</p>
  </div>

  <script>
    function sendToWhatsApp() {
      const targetPhone = "447786708447"; 

      const trade = document.getElementById('trade').value;
      const postcode = document.getElementById('postcode').value;
      const name = document.getElementById('name').value;
      const details = document.getElementById('details').value;

      if (!postcode || !name || !details) {
        alert("Please fill in your postcode, name, and job details.");
        return;
      }

      const message = `*NEW JOB REQUEST*%0A%0A` +
                      `*Service:* ${trade}%0A` +
                      `*Location:* ${postcode}%0A` +
                      `*Customer:* ${name}%0A` +
                      `*Details:* ${details}`;

      window.location.href = `https://wa.me/${targetPhone}?text=${message}`;
    }
  </script>

</body>
</html>
